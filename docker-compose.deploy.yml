services:
  mongo:
    image: mongo:7
    container_name: streamflix-prod-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    image: ${DOCKERHUB_USERNAME}/streamflix-app:latest
    container_name: streamflix-prod-app
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/streamflix
      - JWT_SECRET=${JWT_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mongo-data: