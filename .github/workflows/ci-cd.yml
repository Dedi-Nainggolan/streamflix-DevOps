name: CI/CD Pipeline StreamFlix (Andi)

on:
  push:
    branches:
      - andi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME_ANDI }}
          password: ${{ secrets.QUAY_PASSWORD_ANDI }}

      - name: Build and Push Backend Image
        run: |
          podman build -t quay.io/231112637/streamflix-backend:latest -f backend/Containerfile.backend .
          podman push quay.io/231112637/streamflix-backend:latest

      - name: Build and Push Frontend Image
        run: |
          podman build -t quay.io/231112637/streamflix-frontend:latest -f frontend/Containerfile.frontend .
          podman push quay.io/231112637/streamflix-frontend:latest
