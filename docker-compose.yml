services:
  mongo:
    image: mongo:7
    container_name: streamflix-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: streamflix-app
    env_file: .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/streamflix
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    container_name: streamflix-mongo-ui
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  mongo-data: